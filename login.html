<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — E-Bendahara Kas Asrama & Pondok</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="assets/img/favicon.png">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950 min-h-screen flex items-center justify-center p-4">

<div id="toast-container"></div>

<div class="w-full max-w-md">
    <!-- Card Utama -->
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-100">
        <!-- Logo & Identitas -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/30">
                <i data-lucide="wallet" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800">E-Bendahara</h1>
            <p class="text-xs text-slate-500 mt-0.5">Sistem Manajemen Kas Asrama & Pondok</p>
            <span class="inline-block mt-2 px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 text-emerald-700 border border-emerald-200">
                ⚡ GitHub Pages Ready (Offline & Portable)
            </span>
        </div>

        <!-- Alert Error / Info -->
        <div id="login-alert" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-600 flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
            <span id="login-alert-msg">Username atau password salah!</span>
        </div>

        <!-- Form Login -->
        <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="w-full pl-9 pr-3 py-2.5 text-sm rounded-lg border border-slate-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
                           placeholder="Masukkan username...">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="w-full pl-9 pr-10 py-2.5 text-sm rounded-lg border border-slate-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
                           placeholder="Masukkan password...">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600">
                        <i id="toggle-pwd-icon" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold text-sm rounded-lg shadow-md shadow-blue-500/25 transition duration-150 flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span id="btn-text">Masuk ke Sistem</span>
            </button>
        </form>

        <!-- Akun Demo Cepat (Quick Switcher) -->
        <div class="mt-6 pt-5 border-t border-slate-100">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider text-center mb-2.5">
                Pilih Akun Demo / Uji Coba:
            </p>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="fillAccount('admin', 'admin123')"
                        class="p-2 rounded-lg bg-blue-50 hover:bg-blue-100 border border-blue-200 text-center transition group">
                    <p class="text-xs font-bold text-blue-700">Bendahara</p>
                    <p class="text-[10px] text-blue-500">Akses Penuh</p>
                </button>
                <button type="button" onclick="fillAccount('sekretaris', 'sekretaris123')"
                        class="p-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-center transition group">
                    <p class="text-xs font-bold text-emerald-700">Sekretaris</p>
                    <p class="text-[10px] text-emerald-500">Input Kas</p>
                </button>
                <button type="button" onclick="fillAccount('pembina', 'pembina123')"
                        class="p-2 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-200 text-center transition group">
                    <p class="text-xs font-bold text-amber-700">Pembina</p>
                    <p class="text-[10px] text-amber-500">Lihat / LPJ</p>
                </button>
            </div>
        </div>
    </div>

    <!-- Footer Copyright -->
    <p class="text-center text-xs text-slate-400 mt-4">
        &copy; 2026 E-Bendahara Asrama & Pondok. Siap di-deploy di GitHub Pages.
    </p>
</div>

<!-- Load Database Storage & Auth Scripts -->
<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    // Inisialisasi ikon Lucide
    lucide.createIcons();

    // Jika sudah login sebelumnya, langsung alihkan ke index.html
    const loggedUser = Auth.getCurrentUser();
    if (loggedUser) {
        window.location.href = 'index.html';
    }

    function togglePasswordVisibility() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('toggle-pwd-icon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.setAttribute('data-lucide', 'eye-off');
        } else {
            pwd.type = 'password';
            icon.setAttribute('data-lucide', 'eye');
        }
        lucide.createIcons();
    }

    function fillAccount(u, p) {
        document.getElementById('username').value = u;
        document.getElementById('password').value = p;
        hideAlert();
    }

    function showAlert(msg, isSuccess = false) {
        const box = document.getElementById('login-alert');
        const text = document.getElementById('login-alert-msg');
        text.textContent = msg;
        if (isSuccess) {
            box.className = 'mb-4 p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-xs text-emerald-700 flex items-center gap-2';
        } else {
            box.className = 'mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-600 flex items-center gap-2';
        }
        box.classList.remove('hidden');
        lucide.createIcons();
    }

    function hideAlert() {
        document.getElementById('login-alert').classList.add('hidden');
    }

    function handleLoginSubmit(e) {
        e.preventDefault();
        hideAlert();

        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const btn = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');

        if (!u || !p) {
            showAlert('Username dan password wajib diisi!');
            return;
        }

        btn.disabled = true;
        btnText.textContent = 'Memverifikasi...';

        try {
            const user = Auth.login(u, p);
            btnText.textContent = 'Sukses! Mengalihkan...';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        } catch (err) {
            showAlert(err.message);
            btn.disabled = false;
            btnText.textContent = 'Masuk ke Sistem';
        }
    }

    // Periksa status redirect logout
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('status') === 'logged_out') {
        showAlert('Anda telah berhasil keluar dari sistem.', true);
    }
</script>
</body>
</html>
